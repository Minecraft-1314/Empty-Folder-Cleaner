[package]
name = "empty-folder-cleaner"
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
description = "Empty Folder Cleaner"
license = "MIT"

[lib]
name = "empty_folder_cleaner"
path = "src/lib.rs"

[[bin]]
name = "EmptyFolderCleaner"
path = "src/main.rs"

[[bin]]
name = "uninstall"
path = "src/bin/uninstall.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
png = "0.17"
rfd = "0.15"
tao = "0.30"
wry = "0.47"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Registry",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
